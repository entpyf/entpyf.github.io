<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>光动力治疗计算器</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%232d5a5e'/%3E%3Cpath d='M7 12.5l3 3 7-7' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="lang-switch">
            <span class="lang-hint" data-i18n="langHint">切换语言</span>
            <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Switch to English">EN</button>
        </div>

        <header>
            <div class="logo">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
                </svg>
            </div>
            <div class="header-text">
                <h1 data-i18n="title">光动力治疗计算器</h1>
                <p class="subtitle" data-i18n="subtitle">Photodynamic Therapy Calculator</p>
            </div>
        </header>

        <div class="card">
            <div class="tabs" role="tablist" data-i18n-aria="tablistLabel">
                <button class="tab-btn active" id="power-trigger" data-tab="power" type="button" role="tab"
                    aria-selected="true" aria-controls="power-tab" tabindex="0" data-i18n="tabPower">功率计算</button>
                <button class="tab-btn" id="energy-trigger" data-tab="energy" type="button" role="tab"
                    aria-selected="false" aria-controls="energy-tab" tabindex="-1" data-i18n="tabEnergy">能量密度</button>
                <button class="tab-btn" id="radius-trigger" data-tab="radius" type="button" role="tab"
                    aria-selected="false" aria-controls="radius-tab" tabindex="-1" data-i18n="tabRadius">儿童半径预测</button>
            </div>

            <!-- 功率计算 -->
            <section class="tab-content active" id="power-tab" data-calculator="power" role="tabpanel"
                aria-labelledby="power-trigger" tabindex="0">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="ed-power" data-i18n="labelEnergyDensity">能量密度</label>
                        <div class="input-wrapper">
                            <input type="number" id="ed-power" value="100" min="0" step="any" inputmode="decimal"
                                enterkeyhint="done" aria-describedby="ed-power-message">
                            <span class="unit">J/cm²</span>
                        </div>
                        <p class="field-message" id="ed-power-message" aria-live="polite"></p>
                    </div>

                    <div class="form-group">
                        <label for="lg-power" data-i18n="labelFiberLength">光纤长度</label>
                        <div class="input-wrapper">
                            <input type="number" id="lg-power" value="3" min="0" step="any" inputmode="decimal"
                                enterkeyhint="done" aria-describedby="lg-power-message">
                            <span class="unit">cm</span>
                        </div>
                        <p class="field-message" id="lg-power-message" aria-live="polite"></p>
                    </div>

                    <div class="form-group">
                        <label for="time-power" data-i18n="labelExposureTime">照射时间</label>
                        <div class="input-wrapper">
                            <input type="number" id="time-power" value="1200" min="0" step="any" inputmode="decimal"
                                enterkeyhint="done" aria-describedby="time-power-message">
                            <span class="unit" data-i18n="unitSeconds">秒</span>
                        </div>
                        <p class="field-message" id="time-power-message" aria-live="polite"></p>
                    </div>

                    <div class="form-group">
                        <label for="r-power" data-i18n="labelRadius">半径</label>
                        <div class="input-wrapper">
                            <input type="number" id="r-power" value="0.5" min="0" step="any" inputmode="decimal"
                                enterkeyhint="done" aria-describedby="r-power-message">
                            <span class="unit">cm</span>
                        </div>
                        <p class="field-message" id="r-power-message" aria-live="polite"></p>
                    </div>
                </div>

                <button class="calculate-btn" type="button" data-calc-target="power" data-i18n="btnCalcPower">计算功率</button>

                <div class="result" id="power-result" data-state="normal" role="status" aria-live="polite"
                    aria-atomic="true" hidden>
                    <p class="result-message" id="power-status" data-i18n="msgPowerResult">已根据当前输入计算输出功率与功率密度。</p>
                    <div class="result-body result-dual">
                        <div class="result-item">
                            <div class="result-label" data-i18n="resultOutputPower">输出功率</div>
                            <div class="result-value">
                                <span id="power-value">0</span>
                                <span class="result-unit">mW</span>
                            </div>
                        </div>
                        <div class="result-item">
                            <div class="result-label" data-i18n="resultPowerDensity">功率密度</div>
                            <div class="result-value">
                                <span id="power-density-value">0</span>
                                <span class="result-unit">mW/cm²</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 能量密度计算 -->
            <section class="tab-content" id="energy-tab" data-calculator="energy" role="tabpanel"
                aria-labelledby="energy-trigger" tabindex="0" hidden>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="op-energy" data-i18n="resultOutputPower">输出功率</label>
                        <div class="input-wrapper">
                            <input type="number" id="op-energy" value="500" min="0" step="any" inputmode="decimal"
                                enterkeyhint="done" aria-describedby="op-energy-message">
                            <span class="unit">mW</span>
                        </div>
                        <p class="field-message" id="op-energy-message" aria-live="polite"></p>
                    </div>

                    <div class="form-group">
                        <label for="lg-energy" data-i18n="labelFiberLength">光纤长度</label>
                        <div class="input-wrapper">
                            <input type="number" id="lg-energy" value="3" min="0" step="any" inputmode="decimal"
                                enterkeyhint="done" aria-describedby="lg-energy-message">
                            <span class="unit">cm</span>
                        </div>
                        <p class="field-message" id="lg-energy-message" aria-live="polite"></p>
                    </div>

                    <div class="form-group">
                        <label for="time-energy" data-i18n="labelExposureTime">照射时间</label>
                        <div class="input-wrapper">
                            <input type="number" id="time-energy" value="1200" min="0" step="any" inputmode="decimal"
                                enterkeyhint="done" aria-describedby="time-energy-message">
                            <span class="unit" data-i18n="unitSeconds">秒</span>
                        </div>
                        <p class="field-message" id="time-energy-message" aria-live="polite"></p>
                    </div>

                    <div class="form-group">
                        <label for="r-energy" data-i18n="labelRadius">半径</label>
                        <div class="input-wrapper">
                            <input type="number" id="r-energy" value="0.5" min="0" step="any" inputmode="decimal"
                                enterkeyhint="done" aria-describedby="r-energy-message">
                            <span class="unit">cm</span>
                        </div>
                        <p class="field-message" id="r-energy-message" aria-live="polite"></p>
                    </div>
                </div>

                <button class="calculate-btn" type="button" data-calc-target="energy" data-i18n="btnCalcEnergy">计算能量密度</button>

                <div class="result" id="energy-result" data-state="normal" role="status" aria-live="polite"
                    aria-atomic="true" hidden>
                    <p class="result-message" id="energy-status" data-i18n="msgEnergyResult">已根据当前输入计算能量密度。</p>
                    <div class="result-body">
                        <div class="result-item result-item-single">
                            <div class="result-label" data-i18n="labelEnergyDensity">能量密度</div>
                            <div class="result-value">
                                <span id="energy-value">0</span>
                                <span class="result-unit">J/cm²</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 半径预测 -->
            <section class="tab-content" id="radius-tab" data-calculator="radius" role="tabpanel"
                aria-labelledby="radius-trigger" tabindex="0" hidden>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="age-radius" data-i18n="labelChildAge">儿童年龄（月龄）</label>
                        <div class="input-wrapper">
                            <input type="number" id="age-radius" value="60" min="0" step="1" inputmode="numeric"
                                enterkeyhint="done" aria-describedby="age-range-hint age-radius-message">
                            <span class="unit" data-i18n="unitMonths">月</span>
                        </div>
                        <p class="field-message" id="age-radius-message" aria-live="polite"></p>
                    </div>

                    <p class="hint" id="age-range-hint" data-i18n="hintAgeRange">儿童年龄模型适用范围为 3-164 月龄；超出范围时仍可计算，但结果仅供参考。</p>
                </div>

                <button class="calculate-btn" type="button" data-calc-target="radius" data-i18n="btnPredictRadius">预测半径</button>

                <div class="result" id="radius-result" data-state="normal" role="status" aria-live="polite"
                    aria-atomic="true" hidden>
                    <p class="result-message" id="radius-status" data-i18n="msgRadiusResult">结果为预测照射半径，单位为 cm。</p>
                    <div class="result-body">
                        <div class="result-item result-item-single">
                            <div class="result-label" data-i18n="resultPredictedRadius">预测照射半径</div>
                            <div class="result-value">
                                <span id="radius-value">0</span>
                                <span class="result-unit">cm</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="site-footer" aria-label="作者与单位信息">
            <p class="footer-author" data-i18n="footerAuthor">作者：Yufei Pan</p>
            <p class="footer-affiliation" data-i18n="footerAffiliation">南京医科大学附属明基医院 · 耳鼻咽喉头颈外科</p>
            <p data-i18n="footerEmail">邮箱：<a href="mailto:entpyf@163.com">entpyf@163.com</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
